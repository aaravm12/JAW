[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jaw-recovery-monitor"
version = "0.1.0"
description = "Local, experimental camera-based mouth movement recorder"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==1.26.4", "opencv-contrib-python==4.11.0.86",
  "mediapipe==0.10.32; platform_system != 'Darwin' or platform_machine != 'x86_64'",
  "mediapipe==0.10.21; platform_system == 'Darwin' and platform_machine == 'x86_64'",
  "matplotlib==3.10.1", "pillow==11.1.0",
  "jax==0.4.38; platform_system == 'Darwin' and platform_machine == 'x86_64'",
  "jaxlib==0.4.38; platform_system == 'Darwin' and platform_machine == 'x86_64'",
  "scipy==1.15.2; platform_system == 'Darwin' and platform_machine == 'x86_64'",
  "PySide6==6.8.3", "pyqtgraph==0.13.7", "platformdirs==4.3.7", "av==14.2.0"
]
[project.optional-dependencies]
test = ["pytest==8.3.5"]
[project.scripts]
jrm = "jrm.__main__:main"
[tool.setuptools.packages.find]
include = ["jrm*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
